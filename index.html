<title>VACID · Acid Line</title>
<style>
  html,body{margin:0;height:100%;background:#2b2c2e;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box;
    touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #rot{display:none;color:#bbb;font-size:14px;margin-bottom:10px;letter-spacing:.05em;text-align:center}
  @media (orientation:portrait) and (max-width:900px){#rot{display:block}}
  #probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #stage{position:relative}
  #panel{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;touch-action:none;
    background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.025) 1px 3px,rgba(255,255,255,.03) 3px 4px),
      linear-gradient(#dcdddf,#c7c8cb);
    border-radius:6px;box-shadow:0 20px 60px #000c,inset 0 2px 0 #fff8}
  #panel *{position:absolute;box-sizing:border-box}
  .sec{border:2px solid #9c9ea2;border-radius:4px;box-shadow:inset 0 2px 0 #fff9,inset 0 -2px 0 #0002}
  .frame{background:#a9abae;border:2px solid #8d8f93;border-radius:6px;box-shadow:inset 0 2px 4px #0005}
  .cell{background:linear-gradient(#d9dadc,#c9cacc);border:2px solid #9a9c9f;border-radius:3px;box-shadow:inset 0 2px 0 #fff9}
  .blk{background:#1c1c1d;border-radius:2px}
  .wk{background:linear-gradient(#f4f4f4,#dedede);border-right:2px solid #a8a8a8}
  .bk{background:linear-gradient(#2a2a2a,#151515);border-radius:0 0 4px 4px;box-shadow:0 4px 6px #0007}
  .t{white-space:nowrap;color:#1d1d1f;font-weight:700;letter-spacing:.06em;transform:translate(-50%,-50%);line-height:1;text-transform:uppercase}
  .t.l{transform:translate(0,-50%)}
  .t.w{color:#f2f2f2}.t.o{color:#ff7a1a}.t.r{color:#e01b1b}
  .btn{cursor:pointer;border-radius:3px;background:linear-gradient(#fdfdfd,#d4d5d7 55%,#bdbec1);
    border:2px solid #6e7074;box-shadow:0 3px 0 #77797d,0 5px 6px #0005,inset 0 2px 0 #fff}

<script>
'use strict';
/* =============== state =============== */
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

const PATCHES=[
  {name:'Psy Clean Saw',   wave:'sawtooth', drive:0.15},
  {name:'Warm Drive Saw',  wave:'sawtooth', drive:0.4},
  {name:'Squelch Square',  wave:'square',   drive:0.3},
  {name:'Dist Square',     wave:'square',   drive:0.75},
  {name:'Hard Psy Dist',   wave:'sawtooth', drive:0.9},

const LS='vacid.tb.v1', N=16;
const emptyStep=()=>({on:false,n:0,oct:0,a:false,s:false});
const S={k:{...KDEF}, wave:'sawtooth', patch:0, drive:0.15, bpm:145, res:1, mode:0, bank:0,
  banks:Array.from({length:8},()=>Array.from({length:N},emptyStep)), sub:true, kick:true, sc:true, kbd:true};

const pat=()=>S.banks[S.bank];

const keyName=()=>NAMES[((S.k.tune%12)+12)%12];

/* =============== audio =============== */
class Engine{

  }
  release(t){ this.held=false; this.vca.gain.cancelScheduledValues(t); this.vca.gain.setTargetAtTime(0,t,0.006); }
  subNote(t,sd){
    const c=this.ctx,o=c.createOscillator(),g=c.createGain(),end=t+sd*0.7;
    o.frequency.value=mtof(subMidi()); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.75,t+0.002);

  }

    const c=this.ctx,o=c.createOscillator(),g=c.createGain();

    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.95,t+0.002); g.gain.setTargetAtTime(0.7,t+0.004,0.04); g.gain.setTargetAtTime(0,t+0.12,0.06);

}

/* play order */
function orderer(){
  let p=-1, dir=1;
  return ()=>{
    const m=MODES[S.mode];
    if(m==='FORWARD') p=(p+1)%N;
    else if(m==='REVERSE') p=p<=0?N-1:p-1;
    else if(m==='PINGPONG'){ if(p<0){p=0;dir=1;} else { if(p+dir>N-1||p+dir<0) dir=-dir; p+=dir; } }
    else p=Math.floor(Math.random()*N);
    return p;
  };
}
let ctx=null, eng=null, playing=false, timer=0, gNext=0, gK=0, aNext=0, aK=0, nextIdx=null, vis=[], cur=-1, first=true;
const beat=()=>60/S.bpm;
function ensureAudio(){ if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)(); eng=new Engine(ctx);} if(ctx.state!=='running') ctx.resume(); }
/* iOS: unlock Web Audio on the first touch, and keep a silent looping <audio> playing so the

let unlocked=false, silentEl=null;
function silentWavUrl(){ const sr=8000,n=sr/2,b=new DataView(new ArrayBuffer(44+n*2)),w=(o,s)=>{for(let i=0;i<s.length;i++)b.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');b.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);
  b.setUint32(24,sr,true);b.setUint32(28,sr*2,true);b.setUint16(32,2,true);b.setUint16(34,16,true);w(36,'data');b.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b.buffer],{type:'audio/wav'})); }
function unlockAudio(){
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  ensureAudio();
  if(unlocked) return; unlocked=true;
  try{ const buf=ctx.createBuffer(1,1,22050), src=ctx.createBufferSource(); src.buffer=buf; src.connect(ctx.destination); src.start(0); }catch(e){}
  try{ silentEl=document.createElement('audio'); silentEl.setAttribute('playsinline',''); silentEl.setAttribute('x-webkit-airplay','deny');
    silentEl.loop=true; silentEl.preload='auto'; silentEl.src=silentWavUrl(); const pr=silentEl.play(); if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){}
}
for(const ev of ['touchend','pointerdown','keydown']) document.addEventListener(ev,unlockAudio,{capture:true,passive:true});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&ctx&&ctx.state!=='running') ctx.resume(); });
function tick(){
  const ahead=ctx.currentTime+0.12, sh=S.k.shuffle*0.5*beat()/4;
  while(gNext<ahead){ // 16th grid: kick on quarters, rolling sub on the off 16ths
    const t=gNext+(gK%2?sh:0);
    if(S.kick&&gK%4===0) eng.kickHit(gNext);
    if(S.sub&&gK%4!==0) eng.subNote(t,beat()/4);
    gK++; gNext+=beat()/4;
  }
  while(aNext<ahead){
    const sd=beat()*RES[S.res][1], i=nextIdx(), s=pat()[i];
    const t=aNext+(S.res===1&&aK%2?sh:0);
    if(s.on) eng.acid(t,acidMidi(s),s.a,!first&&prevOn&&prevSlide,s.s,sd); else if(eng.held) eng.release(t);
    prevOn=s.on; prevSlide=s.s; first=false;
    vis.push({t,i}); aK++; aNext+=sd;
  }
}
let prevOn=false, prevSlide=false;
function run(){
  ensureAudio(); playing=true; first=true; gK=aK=0; nextIdx=orderer(); vis=[];
  gNext=aNext=ctx.currentTime+0.06; tick(); timer=setInterval(tick,20); refresh();
}
function stop(){ playing=false; clearInterval(timer); eng&&eng.silence(); vis=[]; cur=-1; refresh(); }
function audition(s){ if(playing||!s.on) return; ensureAudio(); eng.acid(ctx.currentTime+0.01,acidMidi(s),s.a,false,false,0.22); }
(function loop(){
  if(playing&&ctx){ const now=ctx.currentTime-(ctx.outputLatency||0); let ch=false;
    while(vis.length&&vis[0].t<=now){ cur=vis.shift().i; ch=true; } if(ch) refreshLive(); }

/* =============== patterns: generate / modify / undo =============== */
const SC=[0,1,3,5,7,8,10,12];      // phrygian, psytrance-friendly
const rnd=Math.random, pick=a=>a[Math.floor(rnd()*a.length)];
let undo=[];
const snap=()=>JSON.parse(JSON.stringify(pat()));
function pushUndo(){ undo.push({bank:S.bank,p:snap()}); if(undo.length>50) undo.shift(); }
function doUndo(){ const u=undo.pop(); if(!u){ flash('NOTHING TO UNDO'); return; } S.banks[u.bank]=u.p; S.bank=u.bank; save(); refresh(); flash('UNDO'); }
function generate(){
  pushUndo();
  S.banks[S.bank]=Array.from({length:N},(_,i)=>{
    const on=i===0||rnd()<0.74, r=rnd();
    return {on, n:r<0.5?0:pick(SC), oct:r>0.85?1:(r>0.8?-1:0), a:rnd()<0.3, s:rnd()<0.2};
  });

}
function modify(){
  pushUndo(); const p=pat(), n=2+Math.floor(rnd()*3);
  for(let j=0;j<n;j++){
    const s=p[Math.floor(rnd()*N)], r=rnd();
    if(r<0.35){ const ix=SC.indexOf(s.n); s.n = ix<0?0:SC[clamp(ix+(rnd()<0.5?-1:1),0,SC.length-1)]; s.on=true; }
    else if(r<0.55) s.a=!s.a; else if(r<0.72) s.s=!s.s; else if(r<0.86) s.on=!s.on; else s.oct=s.oct?0:pick([1,-1]);

/* =============== MIDI (format 1: Acid ch1 + Sub ch2, 4 bars) =============== */
const vlq=n=>{const b=[n&127]; while(n>>=7) b.unshift((n&127)|128); return b;};
function track(name,notes,ch,tempo,total){
  const ev=[]; notes.forEach(n=>{ev.push([n.st,1,n]);ev.push([n.en,0,n]);}); ev.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const d=[0,0xFF,3,name.length,...[...name].map(c=>c.charCodeAt(0))];
  if(tempo){ const us=Math.round(6e7/S.bpm); d.push(0,0xFF,0x51,3,us>>16&255,us>>8&255,us&255,0,0xFF,0x58,4,4,2,24,8); }

  d.push(...vlq(total-now),0xFF,0x2F,0); const L=d.length;

}
function buildMidi(){
  const PPQ=96, total=16*PPQ, T=Math.round(PPQ*RES[S.res][1]), steps=Math.round(total/T), sw=Math.round(S.k.shuffle*0.5*24);
  const nx=orderer(), seq=Array.from({length:steps},()=>pat()[nx()]), acid=[], sub=[]; let last=null;
  const tk=k=>k*T+(S.res===1&&k%2?sw:0);
  for(let k=0;k<steps;k++){
    const s=seq[k], prev=seq[k-1], next=seq[k+1];
    if(!s.on){ last=null; continue; }
    const p=clamp(acidMidi(s),0,127), st=tk(k), v=s.a?127:90;
    let en=s.s?(k+1<steps?tk(k+1)+(next.on?Math.max(2,T>>2):0):total):st+Math.max(1,Math.round(T*0.55));
    en=Math.min(en,total);
    if(prev&&last&&prev.on&&prev.s&&last.p===p){ last.en=en; last.v=Math.max(last.v,v); continue; }
    acid.push(last={p,st,en,v});
  }
  for(let k=0;k<64;k++) if(S.sub&&k%4){ const st=k*24+(k%2?sw:0); sub.push({p:subMidi(),st,en:st+17,v:100}); }
  return new Uint8Array([0x4D,0x54,0x68,0x64,0,0,0,6,0,1,0,2,0,PPQ,...track('Acid',acid,0,true,total),...track('Sub',sub,1,false,total)]);
}
function exportMidi(){
  const name=`vacid_pattern${S.bank+1}_${keyName()}_${S.bpm}bpm.mid`, blob=new Blob([buildMidi()],{type:'audio/midi'});
  const iOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const dl=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.rel='noopener'; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000); flash('MIDI EXPORTED'); };

    try{ const f=new File([blob],name,{type:'audio/midi'});
      if(navigator.canShare({files:[f]})){ navigator.share({files:[f],title:name}).then(()=>flash('MIDI SHARED')).catch(e=>{ if(e&&e.name!=='AbortError') dl(); }); return; }
    }catch(e){}
  }

}

/* =============== panel construction (coords in a 1024x444 reference grid) =============== */
const U=2, W=1024, H=444, panel=document.getElementById('panel');
panel.style.width=W*U+'px'; panel.style.height=H*U+'px';
function mk(cls,x,y,w,h,parent=panel,tag='div'){ const e=document.createElement(tag); if(cls) e.className=cls;
  Object.assign(e.style,{left:x*U+'px',top:y*U+'px'}); if(w!=null) e.style.width=w*U+'px'; if(h!=null) e.style.height=h*U+'px'; parent.appendChild(e); return e; }
function T(txt,x,y,size,cls='',parent=panel){ const e=mk('t '+cls,x,y,null,null,parent); e.textContent=txt; e.style.fontSize=size*U+'px'; return e; }
function led(x,y,r=3.4,parent=panel){ return mk('led',x-r,y-r,2*r,2*r,parent); }
function btn(x,y,w,h,cls='',onclick,onlong){ const b=mk('btn '+cls,x,y,w,h);

/* knob: SVG, black cap with knurling + white pointer, optional tick ring and stepped positions */
const knobs={};
function knob(key,{x,y,r,min=0,max=1,log=false,ticks=11,steps=null,angles=null,label,fmt,get,set,def}){

  let tk=''; for(let i=0;i<ticks;i++){ const a=(-135+270*i/(ticks-1))*Math.PI/180; tk+=`<line x1="${(Math.sin(a)*(r+3)).toFixed(2)}" y1="${(-Math.cos(a)*(r+3)).toFixed(2)}" x2="${(Math.sin(a)*(r+7)).toFixed(2)}" y2="${(-Math.cos(a)*(r+7)).toFixed(2)}" stroke="#333" stroke-width="1"/>`; }

    <defs><radialGradient id="kc_${key}" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#5a5a5c"/><stop offset=".55" stop-color="#1a1a1b"/><stop offset="1" stop-color="#050505"/></radialGradient>
    <linearGradient id="ks_${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f2f2"/><stop offset="1" stop-color="#8d8f92"/></linearGradient></defs>
    ${tk}<circle r="${r+0.6}" fill="#0006" cy="1.6"/><circle r="${r}" fill="url(#ks_${key})" stroke="#555" stroke-width=".6"/>
    <g class="rot"><circle r="${r*0.86}" fill="url(#kc_${key})" stroke="#000" stroke-width="${r*0.09}" stroke-dasharray="${(r*0.16).toFixed(2)} ${(r*0.1).toFixed(2)}"/>
    <circle r="${r*0.62}" fill="url(#kc_${key})"/><line x1="0" y1="${-r*0.12}" x2="0" y2="${-r*0.8}" stroke="#fff" stroke-width="${Math.max(1.4,r*0.11)}" stroke-linecap="round"/></g></svg>`;
  const rot=e.querySelector('.rot');
  const toN=v=>log?Math.log(v/min)/Math.log(max/min):(v-min)/(max-min), fromN=n=>log?min*Math.pow(max/min,n):min+n*(max-min);
  const g=get||(()=>S.k[key]), st=set||(v=>{S.k[key]=v;});
  function render(){ const v=g(); const a=steps?angles[v]:-135+270*clamp(toN(v),0,1); rot.setAttribute('transform',`rotate(${a})`); }
  function setV(v,show=true){ if(steps){ v=clamp(Math.round(v),0,steps-1); } else { v=clamp(v,min,max); if(key==='tune') v=Math.round(v); }
    st(v); render(); eng&&eng.apply(); save(); if(show&&label) flash(label+' '+(fmt?fmt(g()):Math.round(toN(g())*100)+'%')); refreshLive(); }

    if(steps) setV(v0+Math.round(dy/30)); else setV(fromN(clamp(v0+dy*(ev.shiftKey?0.001:0.005),0,1))); });

  e.addEventListener('wheel',ev=>{ ev.preventDefault(); const d=ev.deltaY<0?1:-1; if(steps) setV(g()+d); else if(key==='tune') setV(g()+d); else setV(fromN(clamp(toN(g())+d*(ev.shiftKey?0.005:0.03),0,1))); },{passive:false});
  e.addEventListener('dblclick',()=>{ if(def!==undefined) setV(def); });
  if(steps) e.addEventListener('click',ev=>{ if(Math.abs(ev.movementY)<1&&y0===null){} });

}

/* ---- sections / frames ---- */
mk('sec',3,3,280,85); mk('sec',284,3,412,85); mk('sec',697,3,324,85);
mk('sec',3,91,1018,133);
mk('frame',12,229,1006,208);

const help=mk('',150,40,724,360); help.id='help';
help.innerHTML=`<div><b>RUN/STOP</b> or <b>Space</b> start/stop · kick on quarters + rolling sub on the root play automatically (SUB / KICK buttons, SIDECHAIN box).<br>
<b>Select a step</b>: click the red step LEDs under the display, ← / →, or EDIT (next step). <b>KEYBOARD</b> LED on = pitch mode: a key sets the selected step's note; click the same key again = rest. KEYBOARD off = step mode: white keys 1–8 select steps (page follows the selection, EDIT LED = 9–16).<br>
<b>ACCENT / SLIDE / DOWN / UP</b> toggle the selected step (LEDs show its state). <b>Pattern 1–8</b> buttons or ▲▼ choose a pattern (auto-saved). PATCH ▲▼ = sound preset.<br>
<b>RANDOMIZE</b> = generate psy acid, <b>MODIFY</b> = mutate a little; long-press (touch), Shift-click, right-click or Ctrl+Z = undo. Tempo: wheel/drag the BPM in the display, or + / −. Knobs: drag, wheel, double-click = reset.<br>
<b>EXPORT MIDI</b> = 4 bars, 2 tracks (Acid ch1 + Sub ch2), slides as overlapping notes. (click to close)</div>`;
help.onclick=toggleHelp;
function toggleHelp(){ help.style.display=help.style.display==='block'?'none':'block'; }

/* =============== editing =============== */
function pressKey(n,wi){
  if(!S.kbd){ if(wi===undefined) return; sel=Math.floor(sel/8)*8+wi; refresh(); flash('STEP '+(sel+1)); return; }
  const s=pat()[sel]; pushUndo();
  if(s.on&&s.n===n){ s.on=false; flash('STEP '+(sel+1)+' REST'); }
  else { s.on=true; s.n=n; audition(s); flash('STEP '+(sel+1)+' '+noteName(s)); }
  save(); refresh();
}
function toggleFx(k){
  const s=pat()[sel]; pushUndo();
  if(k==='a') s.a=!s.a; else if(k==='s') s.s=!s.s; else if(k==='u') s.oct=s.oct===1?0:1; else s.oct=s.oct===-1?0:-1;
  save(); refresh();
}
function setPatch(i){ S.patch=i; S.wave=PATCHES[i].wave; S.drive=PATCHES[i].drive; eng&&eng.apply(); save(); refresh(); }
function setBpm(b){ S.bpm=clamp(b,60,200); save(); refreshLive(); }
const noteName=s=>{ const m=acidMidi(s); return NAMES[m%12]+(Math.floor(m/12)-1); };

/* =============== display refresh =============== */
let flashT=0, flashMsg='';
function flash(m){ flashMsg=m; clearTimeout(flashT); flashT=setTimeout(()=>{flashMsg=''; refreshLive();},1100); refreshLive(); }
function refreshLive(){
  const p=pat();
  patTxt.textContent='Pattern '+String(S.bank+1).padStart(3,'0');
  bpmTxt.textContent=S.bpm+' BPM';
  patchTxt.textContent=flashMsg||PATCHES[S.patch].name;
  const s=p[sel]; keyTxt.textContent=flashMsg?'':`ST${String(sel+1).padStart(2,'0')} ${s.on?noteName(s):'REST'}`;
  stepLeds.forEach((e,i)=>{ e.className='s'+(p[i].on?' on':'')+(playing&&i===cur?' cur':'')+(i===sel?' sel':''); });
  const ps=playing&&cur>=0?p[cur]:null;
  fxPlayLed.a.classList.toggle('on',!!(ps&&ps.on&&ps.a)); fxPlayLed.s.classList.toggle('on',!!(ps&&ps.on&&ps.s));
  fxPlayLed.d.classList.toggle('on',!!(ps&&ps.on&&ps.oct<0)); fxPlayLed.u.classList.toggle('on',!!(ps&&ps.on&&ps.oct>0));
  // key LEDs
  const page=Math.floor(sel/8);
  for(const nk in keyLeds){ let on=false; const n=+nk;
    if(S.kbd) on = s.on && s.n===n;
    else { const wi=WK.indexOf(n); if(wi>=0){ const st=page*8+wi; on = playing ? st===cur || (p[st].on && !playing) : p[st].on; if(st===sel) on=true; } }
    keyLeds[nk].classList.toggle("on",on); }
  editLed.classList.toggle('on',page===1); pageTxt.textContent=page?'9-16':'1-8';
  runLed.classList.toggle('on',playing&&(cur<0||cur%4===0||!playing)?playing:false);
}
function refresh(){
  const s=pat()[sel];
  wth.style.left=(S.wave==='sawtooth'?0:15)*U+'px';
  fxLed.a.classList.toggle('on',s.a); fxLed.s.classList.toggle('on',s.s); fxLed.d.classList.toggle('on',s.oct<0); fxLed.u.classList.toggle('on',s.oct>0);
  optBtns.subLed.classList.toggle('on',S.sub); optBtns.kickLed.classList.toggle('on',S.kick);
  scLed.classList.toggle('on',S.sc); kbdLed.classList.toggle('on',S.kbd);
  bankBtns.forEach((b,i)=>{ b.style.background=i===S.bank?'linear-gradient(#ffe9e6,#ffb7ad)':''; b.style.boxShadow=i===S.bank?'0 0 10px #ff2a1a88, inset 0 2px 0 #fff':''; });
  modeLbl.forEach((t,i)=>{ t.style.background=i===S.mode?'#111':'transparent'; t.style.color=i===S.mode?'#fff':'#1d1d1f'; });
  Object.values(knobs).forEach(k=>k.render());
  runBtn.classList.toggle('press',playing);
  refreshLive();
}

/* =============== persistence, keys, scaling =============== */
let saveT=0; function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} },200); }
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); playing?stop():run(); }
  else if(e.code==='ArrowRight'){ sel=(sel+1)%N; refresh(); }
  else if(e.code==='ArrowLeft'){ sel=(sel+N-1)%N; refresh(); }
  else if((e.ctrlKey||e.metaKey)&&e.code==='KeyZ'){ e.preventDefault(); doUndo(); }
  else if(e.key==='+'||e.key==='='){ setBpm(S.bpm+1); } else if(e.key==='-'){ setBpm(S.bpm-1); }
  else if(e.key==='Escape'&&help.style.display==='block') toggleHelp();
},true);
function fit(){ const pr=getComputedStyle(document.getElementById('probe')), px=v=>parseFloat(v)||0;
  const vw=(window.visualViewport?visualViewport.width:innerWidth)-px(pr.paddingLeft)-px(pr.paddingRight);
  const rot=document.getElementById('rot'), rh=rot.offsetHeight?rot.offsetHeight+10:0;
  const vh=(window.visualViewport?visualViewport.height:innerHeight)-px(pr.paddingTop)-px(pr.paddingBottom)-rh;
  const m=vw<1000?4:16, s=Math.min((vw-m)/(W*U),(vh-m)/(H*U));
  panel.style.transform=`scale(${s})`; const st=document.getElementById('stage'); st.style.width=W*U*s+'px'; st.style.height=H*U*s+'px'; }
addEventListener('resize',fit); addEventListener('orientationchange',()=>setTimeout(fit,250)); if(window.visualViewport) visualViewport.addEventListener('resize',fit); fit();
try{ const o=JSON.parse(localStorage.getItem(LS));
  if(o&&Array.isArray(o.banks)&&o.banks.length===8){ Object.assign(S,o,{k:{...KDEF,...o.k}}); S.patch=clamp(S.patch|0,0,PATCHES.length-1); }
  else { generate(); undo=[]; } }catch(e){ generate(); undo=[]; }
refresh();
window.VACID={S,buildMidi,generate,modify,doUndo,run,stop};
